# gitleaks config for homelab-soc-portfolio
#
# Extends the upstream default ruleset with two custom rules added 2026-05-19
# in response to the workspace audit. This is the repo that suffered the
# 38-day public exposure of an ed25519 private key in 2026-04-11 -- the
# multiline-openssh-private-key rule below is the structural fix.

[extend]
useDefault = true

[[rules]]
id = "tailscale-cgnat-ip"
description = "Tailscale CGNAT IP literal (100.64.0.0/10) -- admin-tier; do not commit to public repos"
regex = '''\b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.\d+\.\d+\b'''
tags = ["tailscale", "privacy"]

[[rules]]
id = "multiline-openssh-private-key"
description = "Multi-line OpenSSH private key block (closes the 2026-04-11 single-line-scrub blind spot that produced a 38-day public leak)"
regex = '''-----BEGIN OPENSSH PRIVATE KEY-----[\s\S]*?-----END OPENSSH PRIVATE KEY-----'''
tags = ["ssh", "key"]

# Added 2026-08-05. Trigger: an outside account forked the three public repos,
# prompting a full re-scan. Tailscale IPs were already covered by the rule above;
# MAC addresses were not covered in ANY of the three configs, and that gap had
# let haccp's real span0 NIC MAC sit public in the sibling homelab-fedramp-low
# repo. This repo and HomeLab-SOC scanned clean (zero MACs at HEAD and in full
# history), so this rule is pure prevention here -- no allowlist is needed, and
# any future hit is a REAL new leak.
[[rules]]
id = "mac-address"
description = "MAC address literal -- host/NIC hardware fingerprint; do not commit to public repos"
regex = '''\b(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}\b'''
tags = ["network", "privacy"]

[allowlist]
description = "Inert detection-rule regex patterns + self-reference"
paths = [
    '''\.gitleaks\.toml$''',
    '''\.pre-commit-config\.yaml$''',
    '''\.github/workflows/gitleaks\.yml$''',
    # Elastic detection rules contain literal PEM markers as SEARCH patterns
    # (alerting on leaked-key appearance). These are not real keys.
    '''elastic/detection-rules/.*\.(ndjson|json)$''',
]
