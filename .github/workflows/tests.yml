name: tests
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches the v2 automation Dockerfile
          cache: pip
          cache-dependency-path: |
            scripts/automation/requirements.txt
            tests/requirements-dev.txt
      - run: pip install -r tests/requirements-dev.txt
      - run: pytest --cov=scripts/automation/scripts --cov-report=term-missing
