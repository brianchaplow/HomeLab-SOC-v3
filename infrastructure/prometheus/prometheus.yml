global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'soc-01-node'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          host: soc-01

  - job_name: 'soc-01-nvidia'
    static_configs:
      - targets: ['host.docker.internal:9835']
        labels:
          host: soc-01

  - job_name: 'attack-01-node'
    static_configs:
      - targets: ['172.20.2.12:9100']
        labels:
          host: attack-01
          vlan: '200'

  - job_name: 'pve-02-node'
    static_configs:
      - targets: ['172.20.3.12:9100']
        labels:
          host: pve-02
          vlan: '300'

  - job_name: 'pve-01-node'
    static_configs:
      - targets: ['172.20.3.11:9100']
        labels:
          host: pve-01
          vlan: '300'
